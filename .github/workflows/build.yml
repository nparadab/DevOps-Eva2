name: Build and Push to ECR

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build backend services with Maven
        run: |
          cd back-despachos && mvn clean package -DskipTests
          cd ../back-ventas && mvn clean package -DskipTests

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        env:
          REGISTRY: 416345627870.dkr.ecr.us-east-1.amazonaws.com
        run: |
          docker build -t $REGISTRY/frontend ./frontend
          docker build -t $REGISTRY/back-despachos ./back-despachos
          docker build -t $REGISTRY/back-ventas ./back-ventas

          docker push $REGISTRY/frontend
          docker push $REGISTRY/back-despachos
          docker push $REGISTRY/back-ventas
