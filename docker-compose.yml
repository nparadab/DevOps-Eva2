version: '3.8'
services:
  back-despachos:
    build: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    container_name: back-despachos
    ports:
      - "8081:8080"
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=innovadb
      - DB_USERNAME=admin
      - DB_PASSWORD=admin123
    depends_on:
      - db
    networks:
      - backend-net

  back-ventas:
    build: ./back-Ventas_SpringBoot/Springboot-API-REST
    container_name: back-ventas
    ports:
      - "8082:8080"
    environment:
      - DB_ENDPOINT=db
      - DB_PORT=3306
      - DB_NAME=innovadb
      - DB_USERNAME=admin
      - DB_PASSWORD=admin123
    depends_on:
      - db
    networks:
      - backend-net

  db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      - MYSQL_ROOT_PASSWORD=admin123
      - MYSQL_DATABASE=innovadb
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=admin123
    ports:
      - "3306:3306"
    networks:
      - backend-net

networks:
  backend-net:
    driver: bridge
