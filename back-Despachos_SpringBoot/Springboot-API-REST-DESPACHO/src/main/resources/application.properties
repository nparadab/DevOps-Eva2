spring.application.name=Springboot-API-REST-Despachos
spring.web.allow-cors=true

# Configuración de la base de datos MySQL en Docker
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.platform=mysql

# Configuración de Hibernate
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Swagger UI
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: habilitar endpoints de salud e información
management.endpoints.web.exposure.include=health,info
management.endpoints.web.base-path=/actuator

# Evitar fallo inmediato si MySQL aún no está listo
spring.datasource.hikari.initializationFailTimeout=0
spring.datasource.hikari.connectionTimeout=30000
